<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой магазин</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
        }

        body.dark {
            background-color: black;
            color: white;
        }
        body.dark header {
            background-color: #333;
        }
        body.dark .card {
            background-color: #444;
            color: white;
        }
        header {
            background-color: #f0f0f0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }
        .cart {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-count {
            background-color: red;
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
        }

        .cover {
            background-color: lightblue;
            text-align: center;
            padding: 50px 20px;
        }

        .cover h1 {
            font-size: 36px;
        }

        .btn {
            background-color: orange;
            color: white;
            padding: 10px 30px;
            display: inline-block;
            border-radius: 5px;
            cursor: pointer;
        }
        .products {
            padding: 20px;
            text-align: center;
        }

        .card-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            border: 1px solid gray;
            padding: 10px;
            width: 250px;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 200px;
        }

        .card button {
            margin: 5px;
            padding: 5px 15px;
            cursor: pointer;
        }

        .form-section {
            padding: 20px;
            background-color: #f9f9f9;
            margin: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .counter-block {
            text-align: center;
            padding: 20px;
            background-color: #e0e0e0;
            margin: 20px;
        }.counter-block button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Мой Магазин</div>
        <nav>
            <ul>
                <li>Главная</li>
                <li>Товары</li>
                <li>Контакты</li>
            </ul>
        </nav>
        <div style="display: flex; gap: 20px;">
            <div class="cart">
                🛒 <span class="cart-count" id="cartTotal">0</span>
            </div>
            <button id="themeButton">Темная тема</button>
        </div>
    </header>
    <section class="cover">
        <h1>Добро пожаловать!</h1>
        <p>Лучшие товары здесь</p>
        <div class="btn">Подробнее</div>
    </section>
    <section class="products">
        <h2>Наши товары</h2>
        <div class="card-grid">
          <div class="card">
                <img src="https://ir.ozone.ru/s3/multimedia-1-r/6937442595.jpg" alt="товар">
                <h3>Шампунь 1</h3>
                <p>Описание товара</p>
                <div>
                    <span id="count1">0</span>
                    <button onclick="addToCart(1)">+</button>
                    <button onclick="removeFromCart(1)">-</button>
                </div>
            </div>
            <div class="card">
                <img src="https://ir.ozone.ru/s3/multimedia-1-j/6930802351.jpg" alt="товар">
                <h3>Шампунь 2</h3>
                <p>Описание товара</p>
                <div>
                    <span id="count2">0</span>
                    <button onclick="addToCart(2)">+</button>
                    <button onclick="removeFromCart(2)">-</button>
                </div>
            </div>
            <div class="card">
                <img src="https://avatars.mds.yandex.net/get-mpic/5254518/2a0000019522fbec4a667e9b4ae618ca95ae/orig" alt="товар">
                <h3>Шампунь 3</h3>
                <p>Описание товара</p>
                <div>
                    <span id="count3">0</span>
                    <button onclick="addToCart(3)">+</button>
                    <button onclick="removeFromCart(3)">-</button>
                </div>
            </div>
        </div>
    </section>
    <section class="form-section">
        <h2>Опрос</h2>
        <form id="simpleForm">
            <div class="form-group">
                <label>1. Ваше имя:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>2. Ваш email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>3. Ваш возраст:</label>
                <input type="number" id="age">
            </div>
            <div class="form-group">
                <label>4. Ваш город:</label>
                <input type="text" id="city">
            </div>
            <div class="form-group">
                <label>5. Комментарий:</label>
                <textarea id="comment" rows="3"></textarea>
            </div>
            
            <button type="submit">Отправить</button>
        </form>
    </section>
    <footer>
        <p>Мой Магазин 2025</p>
    </footer><script>
        let cart1 = 0, cart2 = 0, cart3 = 0;
        function addToCart(product) {
            if (product == 1) {
                cart1++;
                document.getElementById('count1').innerText = cart1;
            } else if (product == 2) {
                cart2++;
                document.getElementById('count2').innerText = cart2;
            } else if (product == 3) {
                cart3++;
                document.getElementById('count3').innerText = cart3;
            }
            updateTotal();
        }
        function removeFromCart(product) {
            if (product == 1 && cart1 > 0) {
                cart1--;
                document.getElementById('count1').innerText = cart1;
            } else if (product == 2 && cart2 > 0) {
                cart2--;
                document.getElementById('count2').innerText = cart2;
            } else if (product == 3 && cart3 > 0) {
                cart3--;
              document.getElementById('count3').innerText = cart3;
            }
            updateTotal();
        }    
        function updateTotal() {
            let total = cart1 + cart2 + cart3;
            document.getElementById('cartTotal').innerText = total;
        }
        
        let themeButton = document.getElementById('themeButton');
        themeButton.onclick = function() {
            document.body.classList.toggle('dark');
            if(document.body.classList.contains('dark')) {
                themeButton.innerText = 'Светлая тема';} 
          else {
                themeButton.innerText = 'Темная тема';}
        
        }
       document.getElementById('simpleForm').onsubmit = function(e) {
            e.preventDefault();
            alert('Спасибо за ответы!');
        }
    </script>
</body>
</html>
